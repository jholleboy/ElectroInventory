<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ElectroInventory</title>
<link rel="stylesheet" href="styles.css">
<script type="module" src="app.js"></script>
</head>
<body>
<main class="shell" aria-label="ElectroInventory">
<header class="mast">
<div class="brand"><span class="mark" aria-hidden="true">◇</span> ELECTRO<span>INVENTORY</span></div>
<span class="demo"><i></i> Dados demonstrativos</span>
<button id="close" class="close" aria-label="Fechar inventário">Esc <span>×</span></button>
</header>
<section id="workspace"></section>
<section id="closed" hidden><h1>ElectroInventory</h1><button data-mode="inventory">Abrir inventário <kbd>I</kbd></button></section>
<footer><span><kbd>↑</kbd> <kbd>↓</kbd> Navegar <kbd>Enter</kbd> Selecionar <kbd>Esc</kbd> Fechar</span><span id="hint" role="status" aria-live="polite"></span></footer>
</main>
<dialog id="confirm"><form method="dialog"><h2>Confirmar simulação</h2><p id="confirmation"></p><div class="buttons"><button value="cancel" autofocus>Cancelar</button><button class="primary" value="confirm">Confirmar</button></div></form></dialog>
</body>
</html>
