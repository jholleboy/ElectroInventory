name: ElectroInventory Legacy release

on:
  workflow_dispatch:
    inputs:
      build_only:
        description: 'Validar no runner privado sem distribuir arquivos'
        type: boolean
        default: true
      version:
        description: 'Tag da candidata, por exemplo v4.0.0'
        required: true
        type: string
        default: v4.0.0
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: legacy-release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-ref:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ref.outputs.version }}
      commit: ${{ steps.ref.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release ref
        id: ref
        shell: bash
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          BUILD_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.build_only }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          sha="$(git rev-parse 'HEAD^{commit}')"
          git merge-base --is-ancestor "$sha" refs/remotes/origin/main
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]]
            if [[ "$BUILD_ONLY" != true ]] && git show-ref --verify --quiet "refs/tags/$VERSION"; then
              [[ "$(git rev-parse "refs/tags/$VERSION^{commit}")" == "$sha" ]]
            fi
          else
            [[ "$GITHUB_REF" == "refs/tags/$VERSION" ]]
          fi
          printf 'version=%s\ncommit=%s\n' "$VERSION" "$sha" >> "$GITHUB_OUTPUT"

  build:
    needs: validate-ref
    runs-on: [self-hosted, Windows, X64, electroinventory-release]
    environment: release-build
    timeout-minutes: 35
    env:
      GTA_LEGACY: ${{ vars.GTA_LEGACY_DIRECTORY }}
      RPH_SDK_SHA256: ${{ vars.RPH_SDK_SHA256 }}
      RELEASE_VERSION: ${{ needs.validate-ref.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate-ref.outputs.commit }}
          persist-credentials: false
          path: inventory
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: jholleboy/lossantosred-ptbr
          ref: ba4115b7c6b5dc0986c19a88fc121a9c9ea33af5
          token: ${{ secrets.RELEASE_DEPENDENCIES_READ_TOKEN || github.token }}
          persist-credentials: false
          path: rc2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: jholleboy/ElectroHud
          ref: c9ba71350ec3b4b358453c5a1bfcdabc82eb21fe
          token: ${{ secrets.RELEASE_DEPENDENCIES_READ_TOKEN || github.token }}
          persist-credentials: false
          path: hud
      - name: Build, test and verify installation ZIP
        shell: powershell
        run: |
          Write-Host "Modo privado: ${{ github.event_name == 'workflow_dispatch' && inputs.build_only }}"
          & .\inventory\release\BUILD_FULL.ps1 -Version $env:RELEASE_VERSION -GtaVDirectory $env:GTA_LEGACY -Rc2Directory .\rc2 -HudDirectory .\hud
      - name: Report Windows validation
        if: ${{ always() }}
        shell: powershell
        env:
          BUILD_STATUS: ${{ job.status }}
          BUILD_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.build_only }}
        run: |
          $mode = if ($env:BUILD_ONLY -eq 'true') { 'Validacao privada' } else { 'Candidata para publicacao' }
          "$mode - resultado da validacao Windows: $env:BUILD_STATUS" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - name: Verify artifact distribution authorization
        if: ${{ github.event_name == 'push' || inputs.build_only == false }}
        shell: powershell
        env:
          LSR_REDISTRIBUTION_APPROVED: ${{ vars.LSR_REDISTRIBUTION_APPROVED }}
        run: |
          if ($env:LSR_REDISTRIBUTION_APPROVED -cne 'true') { throw 'A autorização de redistribuição do LS RED não foi configurada.' }
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'push' || inputs.build_only == false }}
        with:
          name: verified-legacy-package
          path: inventory/artifacts/release/*
          if-no-files-found: error
          retention-days: 3

  publish:
    if: ${{ github.event_name == 'push' || inputs.build_only == false }}
    needs: [validate-ref, build]
    runs-on: ubuntu-latest
    environment: release-publish
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-legacy-package
          path: package
      - name: Verify and publish GitHub prerelease
        shell: bash
        working-directory: package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.validate-ref.outputs.version }}
          COMMIT: ${{ needs.validate-ref.outputs.commit }}
          LSR_REDISTRIBUTION_APPROVED: ${{ vars.LSR_REDISTRIBUTION_APPROVED }}
        run: |
          set -euo pipefail
          if [[ "$LSR_REDISTRIBUTION_APPROVED" != true ]]; then
            echo "::error::Distribuição do LS RED exige autorização do titular e aprovação do ambiente release-publish."
            exit 1
          fi
          zip=ElectroInventory-V4-Legacy-Full.zip
          sha256sum --check --strict "$zip.sha256"
          jq -e --arg sha "$COMMIT" --arg version "$VERSION" \
            '.electroInventoryCommit == $sha and .version == $version' manifest.json
          if gh release view "$VERSION" --json isDraft > /dev/null 2>&1; then
            echo "::error::Já existe uma release ou rascunho com esta tag. Nenhum arquivo foi substituído."
            exit 1
          fi
          # Verify an existing tag before attaching assets. API errors other than 404 fail closed.
          if gh api "repos/$GH_REPO/git/ref/tags/$VERSION" > tag.json 2> tag-error.txt; then
            tag_sha="$(jq -r .object.sha tag.json)"
            tag_type="$(jq -r .object.type tag.json)"
            while [[ "$tag_type" == tag ]]; do
              gh api "repos/$GH_REPO/git/tags/$tag_sha" > tag.json
              tag_sha="$(jq -r .object.sha tag.json)"
              tag_type="$(jq -r .object.type tag.json)"
            done
            [[ "$tag_type" == commit && "$tag_sha" == "$COMMIT" ]]
            verify=(--verify-tag)
          elif grep -q 'HTTP 404' tag-error.txt; then
            verify=()
          else
            cat tag-error.txt >&2
            exit 1
          fi
          gh release create "$VERSION" "$zip" "$zip.sha256" manifest.json \
            --target "$COMMIT" "${verify[@]}" --draft --prerelease \
            --title "ElectroInventory $VERSION · Legacy" --notes-file RELEASE_NOTES.md
          gh release view "$VERSION" --json assets,isDraft --jq '.isDraft and (.assets | length == 3)' | grep -qx true
          gh release edit "$VERSION" --draft=false --prerelease
